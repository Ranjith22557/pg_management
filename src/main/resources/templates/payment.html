<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/payment.css">
</head>
<body>
<div th:replace="navbar.html"></div>
<div class="container mt-5">
    <h1>Payment Details</h1>

    <div class="card p-4 mb-4 shadow-sm">
        <h5 class="mb-3">Filter by Customer ID</h5>
        <form action="/getCustomer" method="get">
            <div class="input-group input-group-sm">
                <input type="text" name="customerId" class="form-control form-control-sm" placeholder="Enter Customer ID" th:value="${param.customerId}"/>
                <button type="submit" class="btn btn-primary btn-sm">Filter</button>
            </div>
        </form>
    </div>

    <div class="card p-4 shadow-sm">
        <h5 class="mb-3">Pending Payments</h5>
        <table class="table table-striped table-bordered table-hover">
            <thead class="table-primary">
            <tr>
                <th>Payment ID</th>
                <th>Customer Name</th>
                <th>Total Amount</th>
                <th>Paid Amount</th>
                <th>Pending Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="customer : ${payments}">
                <td th:text="${customer.id}"></td>
                <td th:text="${customer.name}"></td>
                <td th:text="${customer.totalAmount}"></td>
                <td th:text="${customer.paidAmount}"></td>
                <td th:text="${customer.pendingAmount}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
