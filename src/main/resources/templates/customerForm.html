<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/customerForm.css}">
</head>
<body class="container mt-5">

<!-- Navbar -->
<div th:replace="navbar.html"></div>

<h2 class="mb-4 text-center">Customer Form</h2>

<!-- Customer Form -->
<form action="/customers/save" method="post" th:object="${customer}" onsubmit="return validateForm()">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input type="text" id="name" th:field="*{name}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" th:field="*{email}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="phone" class="form-label">Phone:</label>
        <input type="text" id="phone" th:field="*{phone}" class="form-control" pattern="[0-9]{10}" required>
        <span id="phoneError" style="color: red;"></span>
    </div>

    <div class="mb-3">
        <label for="roomNumber" class="form-label">Room Number:</label>
        <select id="roomNumber" th:field="*{roomNumber}" class="form-control">
            <option value="">Select Room</option>
            <option th:each="room :${rooms}" th:value="${room}" th:text="${room}"></option>
        </select>
    </div>


    <div class="mb-3 row">
        <div class="col-md-3">
            <label for="capacity" class="col-form-label">Total Capacity:</label>
            <input type="number" th:field="*{room.capacity}" id="capacity" class="form-control" readonly>
        </div>

        <div class="col-md-3">
            <label for="occupied" class="col-form-label">Occupied:</label>
            <input type="number" th:field="*{room.occupiedSpots}" id="occupied" class="form-control" readonly>
        </div>

        <div class="col-md-3">
            <label for="vacant" class="col-form-label">Vacant:</label>
            <input type="number" th:field="*{room.vacant}" id="vacant" class="form-control" readonly>
        </div>
    </div>

    <div class="mb-3">
        <label for="joinDate" class="form-label">Join Date:</label>
        <input type="date" id="joinDate" th:field="*{joinDate}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="paymentDate" class="form-label">Payment Date:</label>
        <input type="date" id="paymentDate" th:field="*{paymentDate}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="totalAmount" class="form-label">Total Amount:</label>
        <input type="number" id="totalAmount" th:field="*{totalAmount}" class="form-control" step="5000" value="5000" readonly="readonly">
    </div>

    <div class="mb-3">
        <label for="paidAmount" class="form-label">Paid Amount:</label>
        <input type="number" id="paidAmount" th:field="*{paidAmount}" class="form-control" step="0.01" required>
    </div>

    <div class="mb-3">
        <label for="pendingAmount" class="form-label">Pending Amount:</label>
        <input type="number" id="pendingAmount" th:field="*{pendingAmount}" class="form-control" step="0.01" readonly>
    </div>

    <div class="mb-3">
        <label for="aadhaarNo" class="form-label">Aadhaar Card No:</label>
        <input type="text" id="aadhaarNo" th:field="*{aadhaarNo}" class="form-control" pattern="[0-9]{12}" required>
        <span id="aadhaarNumber" style="color: red;"></span>
    </div>

    <div class="mb-3">
        <label for="address" class="form-label">Address:</label>
        <input type="text" id="address" th:field="*{address}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="company" class="form-label">Company Name:</label>
        <input type="text" id="company" th:field="*{company}" class="form-control">
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-success">Save</button>
    </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/customerForm.js}"></script>

</body>
</html>
